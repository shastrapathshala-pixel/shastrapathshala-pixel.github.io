<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | ShastraPathshala</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#203a43;
}
.box{
  max-width:400px;
  margin:80px auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
  text-align:center;
}
input, select, button{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
}
button{
  background:#ff9800;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Student Registration</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <select id="class">
    <option value="">Select Class</option>
    <option value="10">Class 10</option>
    <option value="12">Class 12</option>
  </select>

  <select id="stream">
    <option value="">Select Stream</option>
    <option value="science">Science</option>
    <option value="arts">Arts</option>
  </select>

  <button onclick="register()">Register</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async function () {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const cls = document.getElementById("class").value;
  const stream = document.getElementById("stream").value;

  if(!name || !email || !password || !cls){
    alert("All fields required");
    return;
  }

  try{
    const userCred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCred.user.uid;

    await setDoc(doc(db, "users", uid), {
      name: name,
      email: email,
      role: "student",
      class: cls,
      stream: cls === "12" ? stream : "",
      status: "active",
      createdAt: serverTimestamp()
    });

    alert("Registration Successful");
    window.location.href = "login.html";

  }catch(err){
    alert(err.message);
  }
}
</script>

</body>
</html>
