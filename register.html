<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Register | ShastraPathshala</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#0f2027;
}
.box{
  max-width:360px;
  margin:70px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
}
input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
}
button{
  width:100%;
  padding:12px;
  background:#ff9800;
  border:none;
  color:white;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Register</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <select id="role">
    <option value="">Select Role</option>
    <option value="student">Student</option>
    <option value="admin">Admin</option>
  </select>

  <button onclick="register()">Register</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  // 🔹 FINAL & CORRECT Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCCOV4uGzXeeRHHEwD0641F0tCCTYzXMFw",
    authDomain: "shastrapathshalamtr.firebaseapp.com",
    projectId: "shastrapathshalamtr",
    storageBucket: "shastrapathshalamtr.appspot.com",
    messagingSenderId: "713511766214",
    appId: "1:713511766214:web:eb9622936e8de80521efc7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 🔹 Register Function
  window.register = async function(){
    try{
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      if(!name || !email || !password || !role){
        alert("Sab field bharo");
        return;
      }

      const userCred = await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      const uid = userCred.user.uid;

      // 🔹 Firestore me user save
      await setDoc(doc(db, "users", uid), {
        name: name,
        email: email,
        role: role,
        createdAt: serverTimestamp()
      });

      alert("Registration Successful ✅");
      window.location.href = "login.html";

    }catch(err){
      alert(err.message);
    }
  }
</script>

</body>
</html>
