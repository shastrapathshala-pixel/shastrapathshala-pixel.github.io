<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Batch Details | ShastraPathshala</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#0f2027;
}
.container{
  max-width:500px;
  margin:50px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
}
h2{
  margin-top:0;
}
.info{
  font-size:14px;
  color:#555;
  margin-bottom:15px;
}
.locked{
  color:#e53935;
  font-weight:bold;
}
button{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:#ff9800;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container" id="content">
  Loading...
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔹 Firebase Config (same everywhere) */
const firebaseConfig = {
  apiKey: "AIzaSyCCOV4uGzXeeRHHEwD0641F0tCCTYzXMFw",
  authDomain: "shastrapathshalamtr.firebaseapp.com",
  projectId: "shastrapathshalamtr",
  storageBucket: "shastrapathshalamtr.appspot.com",
  messagingSenderId: "713511766214",
  appId: "1:713511766214:web:eb9622936e8de80521efc7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const container = document.getElementById("content");

/* 🔗 Read batchId from URL */
const params = new URLSearchParams(window.location.search);
const batchId = params.get("batchId");

if(!batchId){
  container.innerHTML = "<p class='locked'>Invalid batch</p>";
}

/* 🔐 Auth + Access Check */
onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  // 🔹 Get student profile
  const userSnap = await getDoc(doc(db, "users", user.uid));
  if(!userSnap.exists()){
    container.innerHTML = "<p class='locked'>Student profile not found</p>";
    return;
  }

  const student = userSnap.data();

  // 🔹 Get batch data
  const batchSnap = await getDoc(doc(db, "batches", batchId));
  if(!batchSnap.exists()){
    container.innerHTML = "<p class='locked'>Batch not found</p>";
    return;
  }

  const batch = batchSnap.data();

  // 🔒 Access rule
  const allowed =
    batch.class === student.class &&
    (batch.stream === "" || batch.stream === student.stream);

  if(!allowed){
    container.innerHTML = `
      <h2>Access Denied 🚫</h2>
      <p class="locked">
        Ye batch Class ${batch.class}
        ${batch.stream ? "(" + batch.stream + ")" : ""}
        ke students ke liye hai.
      </p>
      <button onclick="window.location.href='batches.html'">
        Go Back
      </button>
    `;
    return;
  }

  /* ✅ Allowed batch content */
  container.innerHTML = `
    <h2>${batch.batchName}</h2>
    <div class="info">
      Class ${batch.class}
      ${batch.stream ? "(" + batch.stream + ")" : ""}
    </div>

    <p>Welcome to this batch 🎉</p>

    <button onclick="goNotes()">📘 View Notes</button>
    <button onclick="goTests()">📝 View Tests</button>
  `;
});

/* 🔗 Navigation */
window.goNotes = function(){
  window.location.href = "notes.html?batchId=" + batchId;
};

window.goTests = function(){
  window.location.href = "tests.html?batchId=" + batchId;
};
</script>

</body>
</html>
