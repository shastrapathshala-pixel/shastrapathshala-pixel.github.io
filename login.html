<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ShastraPathshala</title>

  <style>
    body{
      margin:0;
      font-family:Segoe UI, sans-serif;
      background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box{
      background:#fff;
      width:100%;
      max-width:360px;
      padding:25px;
      border-radius:16px;
      box-shadow:0 12px 30px rgba(0,0,0,.35);
      text-align:center;
    }
    .box img{
      width:80px;
      height:80px;
      border-radius:50%;
      margin-bottom:10px;
    }
    h2{
      margin:5px 0 15px;
      color:#ff9800;
    }
    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:15px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      background:#ff9800;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }
    button.secondary{
      background:#607d8b;
    }
    .msg{
      margin-top:10px;
      font-size:14px;
      color:red;
    }
  </style>
</head>

<body>

<div class="box">
  <img src="logo.jpg" alt="Logo">
  <h2>Login / Register</h2>

  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>

  <button onclick="register()">Register</button>
  <button class="secondary" onclick="login()">Login</button>

  <div class="msg" id="msg"></div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
  import { 
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC...",
    authDomain: "shastrapathshalamtr.firebaseapp.com",
    projectId: "shastrapathshalamtr",
    storageBucket: "shastrapathshalamtr.appspot.com",
    messagingSenderId: "713511766214",
    appId: "1:713511766214:web:eb9622936e8de80521efc7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.register = async () => {
    const email = email.value;
    const password = password.value;
    msg.innerText = "";

    try{
      const res = await createUserWithEmailAndPassword(auth,email,password);

      await setDoc(doc(db,"users",res.user.uid),{
        email: email,
        role: "student",
        status: "active",
        createdAt: new Date()
      });

      window.location.href = "dashboard.html";
    }catch(err){
      msg.innerText = err.message;
    }
  };

  window.login = async () => {
    const email = email.value;
    const password = password.value;
    msg.innerText = "";

    try{
      const res = await signInWithEmailAndPassword(auth,email,password);
      window.location.href = "dashboard.html";
    }catch(err){
      msg.innerText = err.message;
    }
  };
</script>

</body>
</html>
