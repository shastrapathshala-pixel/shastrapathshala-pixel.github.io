<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Login | ShastraPathshala</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#203a43;
    }
    .box{
      max-width:380px;
      margin:60px auto;
      background:#fff;
      padding:25px;
      border-radius:10px;
      text-align:center;
    }
    input, button{
      width:100%;
      padding:12px;
      margin:8px 0;
    }
    button{
      background:#2c5364;
      border:none;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCOV4uGzXeeRHHEwD0641F0tCCTYzXMFw",
    authDomain: "shastrapathshalamtr.firebaseapp.com",
    projectId: "shastrapathshalamtr",
    storageBucket: "shastrapathshalamtr.appspot.com",
    messagingSenderId: "713511766214",
    appId: "1:713511766214:web:eb9622936e8de80521efc7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        alert("Login successful");
        window.location.href = "index.html";
      })
      .catch(error => alert(error.message));
  }
</script>

</body>
</html>
