<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login | ShastraPathshala</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>Login</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>
<button id="loginBtn">Login</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCOV4uGzXeeRHHEwD0641F0tCCTYzXMFw",
  authDomain: "shastrapathshalamtr.firebaseapp.com",
  projectId: "shastrapathshalamtr",
  storageBucket: "shastrapathshalamtr.appspot.com",
  messagingSenderId: "713511766214",
  appId: "1:713511766214:web:eb9622936e8de80521efc7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    const email = email.value;
    const password = password.value;

    const cred = await signInWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    const snap = await getDoc(doc(db, "users", uid));

    if (!snap.exists()) {
      alert("User profile not found");
      return;
    }

    const role = snap.data().role;

    if (role === "admin") {
      window.location.href = "admin-dashboard.html";
    } else {
      window.location.href = "student-dashboard.html";
    }

  } catch (e) {
    alert(e.message);
  }
});
</script>

</body>
</html>
