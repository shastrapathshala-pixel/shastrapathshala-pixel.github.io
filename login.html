<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Login | ShastraPathshala</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCOV4uGzXeeRHHEwD0641F0tCCTYzXMFw",
      authDomain: "shastrapathshalamtr.firebaseapp.com",
      projectId: "shastrapathshalamtr",
      storageBucket: "shastrapathshalamtr.appspot.com",
      messagingSenderId: "713511766214",
      appId: "1:713511766214:web:eb9622936e8de80521efc7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCred.user.uid;

        const snap = await getDoc(doc(db, "users", uid));
        const role = snap.data().role;

        if (role === "admin") {
          window.location.href = "dashboard-admin.html";
        } else {
          window.location.href = "dashboard-student.html";
        }
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    }
  </script>

  <style>
    body{
      margin:0;
      font-family:Segoe UI,sans-serif;
      background:#0f2027;
      color:#000;
    }
    .box{
      max-width:380px;
      margin:80px auto;
      background:#fff;
      padding:25px;
      border-radius:16px;
      text-align:center;
    }
    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border-radius:8px;
      border:1px solid #ccc;
    }
    button{
      width:100%;
      padding:12px;
      background:#ff9800;
      border:none;
      color:#fff;
      border-radius:8px;
      font-size:16px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</body>
</html>
