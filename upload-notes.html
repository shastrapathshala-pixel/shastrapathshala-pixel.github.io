<!DOCTYPE html>
<html>
<head>
  <title>Upload Notes | ShastraPathshala</title>
  <style>
    body{
      font-family: Arial;
      background:#f4f6f8;
    }
    .box{
      max-width:400px;
      margin:40px auto;
      background:white;
      padding:20px;
      border-radius:10px;
    }
    input, select, button{
      width:100%;
      padding:10px;
      margin:8px 0;
    }
    button{
      background:#ff9800;
      color:white;
      border:none;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Upload Notes</h2>

  <!-- Title -->
  <input type="text" id="title" placeholder="Notes Title" required>

  <!-- File -->
  <input 
    type="file" 
    id="notesFile" 
    accept=".pdf,.html" 
    required
  >

  <!-- Class -->
  <select id="classSelect" onchange="handleClass()" required>
    <option value="">Select Class</option>
    <option value="10">Class 10</option>
    <option value="12">Class 12</option>
  </select>

  <!-- Stream -->
  <select id="streamSelect" style="display:none;">
    <option value="">Select Stream</option>
    <option value="science">Science</option>
    <option value="arts">Arts</option>
  </select>

  <button onclick="uploadNotes()">Upload</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.handleClass = function(){
    const cls = document.getElementById("classSelect").value;
    document.getElementById("streamSelect").style.display =
      cls === "12" ? "block" : "none";
  }

  window.uploadNotes = async function(){
    const title = document.getElementById("title").value;
    const cls = document.getElementById("classSelect").value;
    const stream = document.getElementById("streamSelect").value;
    const file = document.getElementById("notesFile").files[0];

    if(!title || !cls || !file){
      alert("All fields required");
      return;
    }

    if(cls === "12" && !stream){
      alert("Select stream");
      return;
    }

    try{
      const path =
        cls === "10"
          ? `notes/10/${file.name}`
          : `notes/12/${stream}/${file.name}`;

      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);

      await addDoc(collection(db,"notes"),{
        title: title,
        class: cls,
        stream: cls === "12" ? stream : "",
        fileUrl: url,
        fileType: file.name.endsWith(".pdf") ? "pdf" : "html",
        createdAt: serverTimestamp()
      });

      alert("Notes Uploaded Successfully ✅");

      document.querySelectorAll("input").forEach(i => i.value = "");
      document.getElementById("classSelect").value = "";
      document.getElementById("streamSelect").style.display = "none";

    }catch(e){
      console.error(e);
      alert("Upload failed ❌");
    }
  }
</script>

</body>
</html>
