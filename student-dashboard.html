<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Student Dashboard | ShastraPathshala</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#203a43;
  color:#fff;
}
.container{
  max-width:420px;
  margin:60px auto;
  background:#fff;
  color:#000;
  border-radius:12px;
  padding:25px;
  text-align:center;
}
button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.action{background:#ff9800;color:white;}
.logout{background:#e53935;color:white;}
</style>
</head>

<body>

<div class="container">
  <h2>Student Dashboard</h2>
  <p>Welcome Student</p>

  <button class="action">My Tests</button>
  <button class="action">Study Notes</button>
  <button class="action">My Results</button>
  <button class="action">Profile</button>

  <button class="logout" onclick="logout()">Logout</button>
</div>
<button onclick="window.location.href='profile.html'">Profile</button>
<script type="module">
  import { getAuth } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const auth = getAuth();
const db = getFirestore();

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));
  const data = snap.data();

  if (data.class === "10") {
    document.getElementById("class10Btn").style.display = "block";
  }

  if (data.class === "12" && data.stream === "science") {
    document.getElementById("class12ScienceBtn").style.display = "block";
  }

  if (data.class === "12" && data.stream === "arts") {
    document.getElementById("class12ArtsBtn").style.display = "block";
  }
});
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCOV4uGzXeeRHHEwD0641F0tCCTYzXMFw",
  authDomain: "shastrapathshalamtr.firebaseapp.com",
  projectId: "shastrapathshalamtr",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.logout = async function(){
  await signOut(auth);
  window.location.href="index.html";
}
</script>

</body>
</html>
